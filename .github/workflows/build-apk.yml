name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Create project files automatically
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'JSON'
          {"name":"karumbu-kanakku","version":"1.0.0","private":true,
           "dependencies":{"@capacitor/android":"^6.1.2","@capacitor/cli":"^6.1.2","@capacitor/core":"^6.1.2"}}
          JSON
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.karumbu.kanakku","appName":"கரும்பு கணக்கு","webDir":"www"}
          JSON
      - name: Install Capacitor
        run: npm install
      - name: Add Android platform
        run: npx cap add android && npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: karumbu-kanakku-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
